services:
  db:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 34221719
      POSTGRES_DB: customers
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

  chandana-api:
    container_name: uploadthirdapp
    image: chan000x/uploadthirdapp:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/customers
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 34221719
    ports:
      - "8080:8080"
    networks:
      - db
    depends_on:
      - db
    restart: unless-stopped

  react-frontend:
    container_name: react-frontend
    build:
      context: Frontend/ReactTutorial/react
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    networks:
      - db
    depends_on:
      - chandana-api

networks:
  db:
    driver: bridge

volumes:
  db:
    driver: local
