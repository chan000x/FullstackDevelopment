server:
  port: 8080
  error:
    include-message: always

cors:
  allowed-origins: ["*"] # Supports all origins
  allowed-methods: ["*"] # Supports all HTTP methods

spring:
  datasource:
    url: jdbc:postgresql://localhost:5332/customers
    username: postgres
    password: 34221719
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: public
    default-schema: public
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false
  main:
    web-application-type: servlet
